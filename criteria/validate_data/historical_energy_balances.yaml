# Reference energy balances from Energy Statistics Data Browser
# https://www.iea.org/data-and-statistics/data-tools/energy-statistics-data-browser
# released under CC-BY

# The criteria-names "Historical Vetting|<Variable>|<Year> will be added
# when instantiating the **HistoricalVetting** validator.
- variable: Final Energy
  region: World
  year: 2010
  value: 365.07  # EJ/yr
  rtol: 0.20
- variable: Final Energy
  region: World
  year: 2015
  value: 389.56  # EJ/yr
  rtol: 0.20
- variable: Final Energy
  region: World
  year: 2020
  upper_bound: 494.02  # EJ/yr # 411.68 * 1.2 (interpolated value with 20% tolerance)
  lower_bound: 316.62  # EJ/yr # 395.78 * 0.8 (actual value with 20% tolerance)
  # value averaged from 2018-2022 to account for COVID
- variable: Final Energy
  region: World
  year: 2025
  value: 442.65  # EJ/yr  # extrapolated 2023 value with 2021-2023 average growth rate
  rtol: 0.20

