# Historical emissions data from CEDS 2025 (Hoesly et al., 2025)

# The criteria-names "Historical Vetting|<Variable>|<Year> will be added
# when instantiating the **HistoricalVetting** validator.
- variable: Emissions|CO2|Energy and Industrial Processes
  region: World
  year: 2010
  value: 33460.1  # Mt CO2/yr
  rtol: 0.20
- variable: Emissions|CO2|Energy and Industrial Processes
  region: World
  year: 2015
  value: 35627.3  # Mt CO2/yr
  rtol: 0.20
- variable: Emissions|CO2|Energy and Industrial Processes
  region: World
  year: 2020
  upper_bound: 44248.8  # Mt CO2/yr # 36874 * 1.2 (interpolated value with 20% tolerance)
  lower_bound: 28309.6  # Mt CO2/yr # 35387 * 0.8 (actual value with 20% tolerance)
  # upper bound interpolated from 2018-2022 to account for COVID recession and recovery
- variable: Emissions|CO2|Energy and Industrial Processes
  region: World
  year: 2025
  value: 39383.5  # Mt CO2/yr
  rtol: 0.20
