# This workflow validates that the project is consistent with the nomenclature
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Validate the project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '**' ]

jobs:
  project-validation:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        nomenclature:
          - "nomenclature-iamc"
          - "git+https://github.com/IAMconsortium/nomenclature"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: 3.13

      - name: Install requirements
        run: pip install nomenclature-iamc

      - name: Run the nomenclature project validation
        run: |
          cd criteria
          nomenclature validate-project .
